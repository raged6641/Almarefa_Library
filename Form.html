<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الطلب</title>
    <link rel="stylesheet" href="style.css">
    <script src="myFunctions.js" defer></script>
</head>
<body>
    <header>
        <h1>طلب شراء كتاب</h1>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="AboutUs.html">من نحن</a></li>
                <li><a href="Books.html">الكتب</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <h2>معلومات العميل</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="fullName">الاسم الكامل:</label>
                    <input type="text" id="fullName" name="fullName" required pattern="^[\u0621-\u064A\s]+$" placeholder="أدخل اسمك الكامل">
                </div>

                <div class="form-group">
                    <label for="nationalId">الرقم الوطني:</label>
                    <input type="text" id="nationalId" name="nationalId" required pattern="^[0-9]{11}$" placeholder="أدخل الرقم الوطني">
                </div>

                <div class="form-group">
                    <label for="dob">تاريخ الميلاد:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="mobile">رقم الموبايل:</label>
                    <input type="text" id="mobile" name="mobile" required pattern="^(093|094)[0-9]{7}$" placeholder="أدخل رقم الموبايل">
                </div>

                <div class="form-group">
                    <label for="email">الإيميل:</label>
                    <input type="email" id="email" name="email" required placeholder="أدخل الإيميل">
                </div>

                <button type="submit" class="submit-btn">إرسال</button>
            </form>
        </section>
    </main>
    <footer onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">
        ↑ <p>جميع الحقوق محفوظة © 2024</p>
    </footer>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(event) {
            event.preventDefault(); // منع الإرسال الافتراضي

            // التحقق من صحة الإدخالات
            const fullName = document.getElementById('fullName').value;
            const nationalId = document.getElementById('nationalId').value;
            const dob = document.getElementById('dob').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;

            if (window.location.pathname.includes('confirmation.html')) {
    const orderData = JSON.parse(sessionStorage.getItem('selectedBook'));

        if (orderData) {
        const summarySection = document.getElementById('orderSummary');
        summarySection.innerHTML = `
            <h2>ملخص الطلب</h2>
            <p><strong>الاسم الكامل:</strong> ${orderData.fullName}</p>
            <p><strong>الرقم الوطني:</strong> ${orderData.nationalId}</p>
            <p><strong>تاريخ الميلاد:</strong> ${orderData.dob}</p>
            <p><strong>رقم الموبايل:</strong> ${orderData.mobile}</p>
            <p><strong>الإيميل:</strong> ${orderData.email}</p>
            <h3>معلومات الكتاب المختار:</h3>
            <p><strong>العنوان:</strong> ${orderData.title}</p>
            <p><strong>السعر:</strong> ${orderData.price}</p>
            <p><strong>رقم ISBN:</strong> ${orderData.isbn}</p>
            <p class="thank-you-message">شكرًا لاختياركم مكتبتنا، نتمنى لكم تجربة قراءة ممتعة!</p>
        `;
    }       else {
        alert('لا توجد بيانات لعرضها.');
        window.location.href = './Form.html';
    } }
    </script>
</body>
</html>
